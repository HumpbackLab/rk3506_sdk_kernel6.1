%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/imu/silan,sc7u22.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silan SC7U22 six-axis inertial measurement unit

maintainers:
  - ncerzzk <huangcmzzk@gmail.com>

description: |
  The SC7U22 is a six-axis IMU containing a three-axis accelerometer and a
  three-axis gyroscope. This binding describes its SPI interface.

properties:
  compatible:
    const: silan,sc7u22

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 10000000

  interrupts:
    maxItems: 1
    description: INT1 FIFO watermark interrupt.

  vdd-supply:
    description: Sensor core power supply.

  vddio-supply:
    description: Sensor digital interface power supply.

required:
  - compatible
  - reg
  - spi-max-frequency
  - interrupts
  - vdd-supply
  - vddio-supply

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        imu@0 {
            compatible = "silan,sc7u22";
            reg = <0>;
            spi-max-frequency = <10000000>;
            interrupt-parent = <&gpio0>;
            interrupts = <15 IRQ_TYPE_EDGE_RISING>;
            vdd-supply = <&vcc_3v3>;
            vddio-supply = <&vcc_3v3>;
        };
    };
...
